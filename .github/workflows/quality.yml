name: Web quality

on:
  pull_request:
  push:
    branches: [main, homolog, production]

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce database schema ownership
        run: pnpm guard:migration-ownership
      - name: Tests
        run: pnpm test
      - name: Security tests
        run: pnpm test:security
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (temporary non-blocking baseline)
        continue-on-error: true
        run: pnpm lint
      - name: Production build
        run: pnpm build
